name: Deploy v5 Preview

on:
  push:
    branches:
      - v5
  workflow_dispatch:

env:
  THEME_NAME: behave-dark

permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write

jobs:
  deploy-v5:
    runs-on: ubuntu-latest
    name: Deploy v5 to GitHub Pages
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Quartz plugins
        uses: actions/cache@v6
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - run: npm ci

      - name: Fetch Quartz Theme
        run: curl -s -S https://raw.githubusercontent.com/saberzero1/quartz-themes/master/action.sh | bash -s -- $THEME_NAME

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Reapply plugin patches
        run: node scripts/patch-plugins.js

      - name: Check types and style
        run: npm run check

      - name: Build Quartz
        run: npx quartz build

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
